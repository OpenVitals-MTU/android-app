# Phone app gate. A change that only touches the wear module or its workflow
# skips this one; wear-test.yml covers it. Shared build files (root Gradle,
# catalog, CI scripts) run both.
name: test

on:
  pull_request:
    paths-ignore: &wear_only
      - "wear/**"
      - ".github/workflows/wear-test.yml"
  push:
    branches: [main]
    paths-ignore: *wear_only

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Two jobs. The tests run on every pull request and push; lint runs on pushes
# to main only (and in the release build, through verifyCi). Lint alone is
# half of the gate's task time, and in one job it shared the runner's four
# cores with the tests and the compiler, which stretched everything; a lint
# finding is rarely what a review turns on, and main still catches it before a
# nightly ships. Locally and in the release build the whole gate is still one
# invocation, verifyCi, which aggregates the three tasks the jobs run.
jobs:
  # verifyCiUnitTest (:wearlink:test, :domain:testCiUnitTest, :app:testCiUnitTest) and verifyCiPreflight
  # (verifyTranslations, :app:checkCiDuplicateClasses, :app:compileCiAndroidTestKotlin).
  # No lint here, so every core gets a test fork (app/build.gradle.kts reads
  # openvitals.testForks).
  tests:
    # The stock runner: it ships JDK 17 and the Android SDK, and
    # scripts/ci-android-setup.sh installs the platform and build-tools the app
    # compiles against when the runner image lacks them. That replaced a
    # prebaked container image (2026-10): pulling it cost as much as the
    # install, and it had to be rebuilt whenever compileSdk moved.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # setup-gradle leaves caching off when the runner already has a Gradle
      # user home with caches in it, so the job uses one of its own. A step,
      # since a job-level env cannot read the runner context.
      - run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/gradle-user-home" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - run: scripts/ci-android-gradle.sh -Popenvitals.testForks=4 verifyCiUnitTest verifyCiPreflight
      - run: git diff --check

  # verifyCiLint (:app:lintCi, :domain:lintCi). Pushes to main only.
  lint:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # setup-gradle leaves caching off when the runner already has a Gradle
      # user home with caches in it, so the job uses one of its own. A step,
      # since a job-level env cannot read the runner context.
      - run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/gradle-user-home" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - run: scripts/ci-android-gradle.sh verifyCiLint
      - run: git diff --check

# Wear OS module gate. Runs only when the watch app or the build plumbing it
# shares with the phone app changes. Phone-only changes never trigger it, and
# a failure here never blocks a phone PR: test.yml is the phone gate.
#
# Keep the paths list in sync with what wear/build.gradle.kts actually
# depends on: the watch app and the shared link module (:wearlink).
name: wear-test

on:
  pull_request:
    paths: &wear_paths
      - "wear/**"
      - "wearlink/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "settings-gradle.lockfile"
      - "gradle/**"
      - "gradlew"
      - "scripts/ci-*"
      - ".github/workflows/wear-test.yml"
  push:
    branches: [main]
    paths: *wear_paths

permissions:
  contents: read

concurrency:
  group: wear-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # verifyWearCi is the root-project aggregate of :wear:testDebugUnitTest,
  # :wear:lintDebug, :wear:assembleDebug and :wear:compileDebugAndroidTestKotlin.
  # One Gradle invocation: the watch module is small enough (about a minute)
  # that splitting it as test.yml does would cost more in setup than it saves.
  verify-wear:
    # The stock runner, as in test.yml; the wear module compiles against the
    # same platform, which scripts/ci-android-setup.sh installs when missing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # setup-gradle leaves caching off when the runner already has a Gradle
      # user home with caches in it, so the job uses one of its own. A step,
      # since a job-level env cannot read the runner context.
      - run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/gradle-user-home" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - run: scripts/ci-android-gradle.sh verifyWearCi
      - run: git diff --check

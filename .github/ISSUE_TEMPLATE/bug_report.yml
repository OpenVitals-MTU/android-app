name: Bug report
description: Something in OpenVitals does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **This issue is public.** Please don't paste health data here: values, the dates of your records, names, medical records, screenshots that show your data, the names of your export files, or device addresses.

        The reports OpenVitals copies (import, sync) hold counts and reasons only, so they are safe to paste. A diagnostics log has addresses, identifiers and dates masked, but it still shows what you did in the app: read it first, or send it by email from Settings → Report an issue.
  - type: input
    id: version
    attributes:
      label: OpenVitals version
      description: Settings → About.
      placeholder: 2.15.1
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Installed from
      options:
        - Google Play
        - Google Play open testing
        - F-Droid
        - GitHub release
        - GitHub nightly
        - GitHub debug APK
        - Built from source
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: Pixel 8, Android 16
    validations:
      required: true
  - type: input
    id: health-connect
    attributes:
      label: Health Connect version
      description: Android Settings → Apps → Health Connect, if you know it.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: textarea
    id: actual
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Report from the app
      description: An import or sync report copied from the app, if there is one.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: Nothing above contains my health data or personal details.
          required: true
